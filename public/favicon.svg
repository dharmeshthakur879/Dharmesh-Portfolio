<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D1" />
      <stop offset="30%" stop-color="#E5BE65" />
      <stop offset="70%" stop-color="#D4A853" />
      <stop offset="100%" stop-color="#996E24" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1626" />
      <stop offset="50%" stop-color="#070B14" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#D4A853" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Dark luxury rounded background container -->
  <rect width="64" height="64" rx="14" fill="url(#darkGrad)" stroke="url(#goldGrad)" stroke-width="1.5" />

  <!-- Outer diamond accent ring -->
  <rect x="18" y="18" width="28" height="28" rx="4" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" transform="rotate(45 32 32)" opacity="0.6" />

  <!-- Inner solid luxury geometric "D" Monogram -->
  <path d="M 22 17 
           L 33 17 
           C 42 17, 47 23, 47 32 
           C 47 41, 42 47, 33 47 
           L 22 47 
           Z 
           M 28 23 
           L 28 41 
           L 32.5 41 
           C 38 41, 41 37.5, 41 32 
           C 41 26.5, 38 23, 32.5 23 
           Z" 
        fill="url(#goldGrad)" 
        filter="url(#goldGlow)" />
  
  <!-- Subtle center gold jewel point -->
  <circle cx="32" cy="32" r="1.5" fill="#FFF3D1" opacity="0.9" />
</svg>
